[SERVO]
servo_min = 600
servo_max = 2400
min_angle = 20
max_angle = 180

[CONTROLLER]
style = 2
threshold = 1000
level1 = 1500
level2 = 2500
level3 = 1800
filtered_level1 = 1000
filtered_level2 = 2500
filtered_level3 = 4000
debug = false

[AUDIO]
buffer_size = 128
source = FILES
output_channels = BOTH
mic_time = 15
ambient = OFF
jaw_part = jaw
vocals_dir = /root/ChatterPi/src/vocals/
ambient_dir = /root/ChatterPi/src/ambient/

[PROP]
prop_trigger = TIMER
delay = 0
eyes = ON
trigger_out = OFF
eyes_part = eyes
trigger_out_part = trigger_out

[PINS]
jaw_pin = 0
pir_pin = 0
eyes_pin = 4
trigger_out_pin = 0

[SCRIPTS]
directory = scripts

[PART jaw]
type = servo
channel = 0
min_angle = 20
max_angle = 180
pulse_min = 600
pulse_max = 2400
rest = 20
smoothing_ms = 100

[PART head]
type = servo
channel = 1
min_angle = -30
max_angle = 30
pulse_min = 500
pulse_max = 2500
rest = 0
smoothing_ms = 500

[PART arm_l]
type = servo
channel = 2
min_angle = 0
max_angle = 120
pulse_min = 500
pulse_max = 2500
rest = 0
smoothing_ms = 400

[PART arm_r]
type = servo
channel = 3
min_angle = 0
max_angle = 120
pulse_min = 500
pulse_max = 2500
rest = 0
smoothing_ms = 400

[PART eyes]
type = led
channel = 4
smoothing_ms = 150

[PART trigger_out]
type = led
channel = 5
enabled = false